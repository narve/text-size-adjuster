<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: transparent; display: inline-block; }
  .frame {
    display: inline-block;
    background: #111;
    border-radius: 36px;
    padding: 16px 10px 10px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
  }
  .notch {
    width: 70px;
    height: 14px;
    background: #111;
    border-radius: 0 0 10px 10px;
    margin: -16px auto 6px;
  }
  .screen { border-radius: 20px; overflow: hidden; background: #fff; }
  img { display: block; }
</style>
</head>
<body>
  <div class="frame">
    <div class="notch"></div>
    <div class="screen">
      <img src="{{IMAGE_SRC}}" />
    </div>
  </div>
</body>
</html>
