name: Publish documentation

# Builds the complete documentation (end-user site + developer/contributor section, see
# docs/test-and-documentation-requirements.md TR7) and publishes it to GitHub Pages.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Also run the full Playwright test suites (Firefox and Chromium)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Browsers are cached between runs. By default only Chromium is installed, without
      # --with-deps: the runner image already has the libraries it needs, and installing them via
      # apt from the Ubuntu mirror can take over ten minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (for screenshots and the docs build)
        if: ${{ !inputs.run_tests }}
        run: npx playwright install chromium

      - name: Install Chromium and Firefox with system dependencies (for the tests)
        if: ${{ inputs.run_tests }}
        run: npx playwright install --with-deps chromium firefox

      # Real-site snapshots aren't committed (TR1a), so fetch them here for the gallery and demos.
      # Non-gating: a site being down or slow just leaves it out of the published gallery.
      - name: Download real-world site snapshots
        run: npm run download -w fixtures
        continue-on-error: true

      - name: Build packages
        run: npm run build -w packages --if-present

      # By default only the tests that take the gallery screenshots run (Chromium).
      - name: Gallery screenshots
        if: ${{ !inputs.run_tests }}
        run: npm run screenshots -w e2e

      - name: Real-world gallery screenshots (informative)
        if: ${{ !inputs.run_tests }}
        run: npm run screenshots:real-world -w e2e
        continue-on-error: true

      - name: Layer 1 test suite (Firefox and Chromium)
        if: ${{ inputs.run_tests }}
        run: npm run test:e2e

      - name: Real-world checks and screenshots (informative)
        if: ${{ inputs.run_tests }}
        run: npm run test:real-world
        continue-on-error: true

      # GITHUB_TOKEN lets the build list the GitHub releases for updates.json without hitting the
      # anonymous API rate limit.
      - name: Build the docs site
        run: npm run docs:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
