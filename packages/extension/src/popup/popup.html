<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- On Android the popup opens as a full page: without this it is laid out 980px wide and
       shown at a fraction of its size. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{name}}</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 240px; padding: 14px; background: var(--surface); }
    .title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 0.95rem; font-weight: 650; }
    .title img { width: 20px; height: 20px; }
    .stepper {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
    }
    .stepper .button { width: 44px; padding: 0; font-size: 1.4rem; line-height: 1; }
    #display { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .actions { display: grid; gap: 6px; margin-top: 10px; }
    .actions .button { width: 100%; min-height: 38px; font-size: 0.92rem; }
    .options-link { display: block; margin-top: 10px; text-align: center; font-size: 0.88rem; }
    .unavailable, .note { margin: 10px 0 0; font-size: 0.88rem; }
    /* As a full page on a phone: use the width, with room for a finger. */
    @media (hover: none) and (pointer: coarse) {
      body { width: auto; max-width: 420px; margin: 0 auto; padding: 20px; }
      .stepper .button { width: 56px; min-height: 56px; }
      .actions .button { min-height: 48px; font-size: 1rem; }
      .options-link { padding: 12px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <p class="title"><img src="icons/icon-48.png" alt="" />{{name}}</p>
  <div class="stepper">
    <button class="button button-primary" id="decrease" aria-label="Decrease text size">−</button>
    <span id="display" aria-live="polite">100%</span>
    <button class="button button-primary" id="increase" aria-label="Increase text size">+</button>
  </div>
  <div class="actions">
    <button class="button" id="reset">Reset to 100%</button>
    <button class="button" id="show-control" hidden>Show the control on this page</button>
    <button class="button button-primary" id="remember" hidden>Remember this site</button>
  </div>
  <p class="note" id="remember-note" role="status" hidden>
    Nothing to remember: this page's text is at its normal size.
  </p>
  <p class="unavailable" id="unavailable" hidden>
    Can't change this page. {{name}} doesn't work on Firefox's own pages or on Mozilla's add-ons
    site, and on other sites it needs permission to access the site.
  </p>
  <a class="options-link" href="#" id="options">Options…</a>
  <script src="popup.js"></script>
</body>
</html>
