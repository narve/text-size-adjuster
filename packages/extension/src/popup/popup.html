<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Text Size Adjuster</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      width: 180px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    button {
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
    }
    button:hover {
      background: #ebebeb;
    }
    #display {
      font-size: 16px;
      min-width: 3.5em;
      text-align: center;
    }
    #reset {
      width: auto;
      padding: 0 10px;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="row">
    <button id="decrease" aria-label="Decrease text size">−</button>
    <span id="display">100%</span>
    <button id="increase" aria-label="Increase text size">+</button>
  </div>
  <button id="reset">Reset</button>
  <script src="popup.js"></script>
</body>
</html>
