<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{name}}</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 240px; padding: 14px; background: var(--surface); }
    .title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 0.95rem; font-weight: 650; }
    .title img { width: 20px; height: 20px; }
    .stepper {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
    }
    .stepper .button { width: 44px; padding: 0; font-size: 1.4rem; line-height: 1; }
    #display { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .actions { display: grid; gap: 6px; margin-top: 10px; }
    .actions .button { width: 100%; min-height: 38px; font-size: 0.92rem; }
    .options-link { display: block; margin-top: 10px; text-align: center; font-size: 0.88rem; }
  </style>
</head>
<body>
  <p class="title"><img src="icons/icon-48.png" alt="" />{{name}}</p>
  <div class="stepper">
    <button class="button button-primary" id="decrease" aria-label="Decrease text size">−</button>
    <span id="display" aria-live="polite">100%</span>
    <button class="button button-primary" id="increase" aria-label="Increase text size">+</button>
  </div>
  <div class="actions">
    <button class="button" id="reset">Reset to 100%</button>
    <button class="button button-primary" id="remember" hidden>Remember this site</button>
  </div>
  <a class="options-link" href="#" id="options">Options…</a>
  <script src="popup.js"></script>
</body>
</html>
