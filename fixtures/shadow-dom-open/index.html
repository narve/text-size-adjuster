<!doctype html>
<html>
<head><meta charset="utf-8"><title>shadow-dom-open</title>
<style>body { font-family: sans-serif; margin: 20px; font-size: 16px; }</style>
</head>
<body>
  <p><img data-tsa-ref="image" src="../assets/sample-image.svg" width="240" height="120" alt="Sample image: images keep their size while text scales"></p>
  <p>This page attaches an open shadow root; the reference elements used for scaling
  verification live inside it, not here in the light DOM.</p>
  <div id="host"></div>
  <script>
    const host = document.getElementById('host');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = `
      <style>
        .box { border: 1px solid #ccc; padding: 12px; font-family: sans-serif; }
        h2 { font-size: 28px; }
        p.fine { font-size: 11px; color: #666; }
      </style>
      <div class="box">
        <h2 data-tsa-ref="large">Inside an open shadow root</h2>
        <p class="fine" data-tsa-ref="small">Fine print inside the same shadow root.</p>
      </div>
    `;
  </script>
</body>
</html>
