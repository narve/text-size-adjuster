<!doctype html>
<html>
<head><meta charset="utf-8"><title>line-height-mixed</title>
<style>
  body { font-family: sans-serif; margin: 20px; font-size: 16px; }
  .normal { line-height: normal; }
  .unitless { line-height: 1.5; }
  .px { line-height: 24px; }
  h1 { font-size: 28px; }
  small { font-size: 11px; color: #666; display: block; }
</style>
</head>
<body>
  <h1 data-tsa-ref="large">Line-height heading</h1>
  <p class="normal" data-tsa-lh-check="normal">Paragraph with line-height: normal.</p>
  <p class="unitless" data-tsa-lh-check="unitless">Paragraph with a unitless line-height of 1.5.</p>
  <p class="px" data-tsa-lh-check="px">Paragraph with an explicit 24px line-height.</p>
  <small data-tsa-ref="small">Fine print for the ratio check.</small>
</body>
</html>
