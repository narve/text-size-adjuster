<!doctype html>
<html>
<head><meta charset="utf-8"><title>large-dom-performance</title>
<style>
  body { font-family: sans-serif; margin: 20px; font-size: 15px; }
  h1 { font-size: 30px; }
  small { font-size: 11px; color: #666; display: block; }
  #feed p { margin: 4px 0; }
</style>
</head>
<body>
  <h1 data-tsa-ref="large">Large feed heading</h1>
  <p><img data-tsa-ref="image" src="../assets/sample-image.svg" width="240" height="120" alt="Sample image: images keep their size while text scales"></p>
  <small data-tsa-ref="small">Fine print for the ratio check.</small>
  <div id="feed"></div>
  <script>
    const feed = document.getElementById('feed');
    const html = [];
    // 2,500 items of two elements each: a real article or feed page has thousands of elements.
    // (The tests take viewport screenshots of this fixture, so its height doesn't matter.)
    for (let i = 0; i < 2500; i++) {
      html.push('<p>Feed item number ' + i + ' — <span>simulated article/social feed text</span> for a performance check.</p>');
    }
    feed.innerHTML = html.join('');
  </script>
</body>
</html>
