<!doctype html>
<html>
<head><meta charset="utf-8"><title>ignore-attr</title>
<style>body { font-family: sans-serif; margin: 20px; } p { font-size: 16px; }</style>
</head>
<body>
  <p id="normal">Normal text, should scale.</p>
  <div data-tsa-ignore>
    <p id="ignored">Simulated widget chrome — must not scale, regardless of factor.</p>
  </div>
</body>
</html>
