<!doctype html>
<html>
<head><meta charset="utf-8"><title>rem-em</title>
<style>
  html { font-size: 16px; }
  body { font-family: sans-serif; margin: 1.25rem; }
  h1 { font-size: 2rem; }
  p { font-size: 1rem; }
  small { font-size: 0.75em; color: #666; display: block; }
</style>
</head>
<body>
  <h1 data-tsa-ref="large">Root-relative heading</h1>
  <p>Body copy sized in rem, relative to the root font-size.</p>
  <small data-tsa-ref="small">Fine print sized in em, relative to its parent paragraph.</small>
</body>
</html>
